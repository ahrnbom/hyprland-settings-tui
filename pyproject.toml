[project]
name = "hyprland-settings-tui"
version = "0.1.1"
description = "A TUI editor for hyprland.lua configs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hyprland-state>=0.4.5",
    "msgspec~=0.21.1",
    "textual~=8.2.8",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
hyprland-settings-tui = "hyprland_settings_tui.main:main"