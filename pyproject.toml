[project]
name = "hyprland-settings-tui"
version = "0.1.0"
description = "A TUI editor for hyprland.lua configs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hyprland-state~=0.4.3",
    "msgspec~=0.21.1",
    "textual~=8.2.8",
]

[tool.uv]
package = true

[project.scripts]
hyprland-settings-tui = "main:main"
